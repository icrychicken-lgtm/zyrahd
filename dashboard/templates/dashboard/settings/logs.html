{% extends "partials/shell.html" %}
{% block title %}Logging · zyrahd.net{% endblock %}
{% block page_title %}Logging{% endblock %}
{% block page_subtitle %}Getrennte Log-Kanäle pro Event{% endblock %}
{% block content %}
<form method="post" class="panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    {% for key, label in fields %}
      <div class="form-row">
        <label>{{ label }}</label>
        <div data-discord-select data-type="channels" data-channel-type="text,announcement" data-name="{{ key }}" data-multiple="false"
             data-selected='{{ cfg|attr(key) or "" }}'></div>
      </div>
    {% endfor %}
  </div>
  <button class="btn btn-primary" type="submit">Speichern</button>
</form>
{% endblock %}
